<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241943">
  <title>Python Quest — Étape 1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <header>
      <div><p class="eyebrow">CHAPITRE I · LA QUÊTE DU CODE</p><h1>🐍 Python Quest</h1></div>
      <div class="stats">⭐ <span id="score">0</span> · <span id="mapName">Village</span></div>
    </header>
    <section class="game-shell">
      <div id="world" class="world" aria-label="Carte du monde"></div>
      <aside class="legend"><strong>Guide de Clairval</strong><p id="hint">Explore le village et rencontre ses mentors.</p></aside>
    </section>
    <nav class="controls" aria-label="Contrôles">
      <button type="button" data-move="up" aria-label="Monter">▲</button>
      <div><button type="button" data-move="left" aria-label="Aller à gauche">◀</button><button type="button" id="action" aria-label="Interagir">A</button><button type="button" data-move="right" aria-label="Aller à droite">▶</button></div>
      <button type="button" data-move="down" aria-label="Descendre">▼</button>
    </nav>
  </main>
  <dialog id="dialog"><div class="dialog-card"><span id="dialog-tag"></span><h2 id="dialog-title"></h2><p id="dialog-text"></p><pre id="dialog-code"></pre><button type="button" id="dialog-next">OK · continuer</button></div></dialog>
  <dialog id="quiz"><div class="dialog-card"><span>🧪 ÉPREUVE DU DONJON</span><h2 id="quiz-title"></h2><p id="quiz-question"></p><div id="quiz-options"></div><button type="button" id="quiz-close">Quitter</button></div></dialog>
  <script src="js/content.js"></script>
  <script src="js/world.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
